# =====================================================================
#  Heizungs-Knopf v2 – Firmware mit Wochenplan, Boost, Urlaub, Menü
#  Hauptplatine: ESP32-C3-WROOM-02-N4 + TMC2209 (STEP/DIR, Strom per UART)
#  Bedienteil:   2,42"-OLED SSD1309 (I2C 0x3C), Tasten PLUS/MINUS, SHT40 (0x44)
#  Sensoren:     DS18B20 am Warmluftaustritt
#  Referenz:     ohne Endschalter – der Motor fährt mit reduziertem Strom gegen
#                den festen Anschlag ✱ des Knopfs (Motoraufsatz v0.3).
#                Der Stecker ENDSTOP (J4, GPIO5) bleibt frei.
#  Eigenständig, ohne Home Assistant. Weboberfläche: heizung_ui.js
#
#  Dateien im selben Ordner:  heizung.yaml · heizung_logik.h · heizung_ui.js · secrets.yaml
#
#  Stufe 0 = ✱ (nur Zündflamme), 1 … 7 = Heizstufen.
#  Die Mechanik-Werte (Positionen, Schritte pro Stufe, Maximum, Richtung, Referenz-Strom)
#  werden im Web unter „Einstellungen“ eingetragen – kein Neu-Flashen nötig.
#  Startwerte für Motoraufsatz v0.3: 1/8-Mikroschritt, Zahnräder 34/22
#  -> ca. 6,9 Schritte pro Grad am Knopf.
#
#  TESTMODUS (Schalter „Testmodus“ im Web): Motor ohne Aufsatz von Hand fahren.
#  Keine Referenzfahrt, Wochenplan und Stufen bewegen den Motor nicht. Beim
#  Einschalten gilt die aktuelle Stellung als Nullpunkt. Grad-Angaben beziehen
#  sich auf den Knopf (Motor dreht 1,55-mal so weit). Nur ohne Aufsatz benutzen
#  oder vorsichtig: im Testmodus gibt es keine Begrenzung auf den Drehbereich.
# =====================================================================

substitutions:
  name: heizung
  friendly_name: Heizung
  speed: "300"            # Schritte/s im Normalbetrieb
  homing_speed: "150"     # Schritte/s bei der Referenzfahrt
  homing_extra: "300"     # so viele Schritte fährt die Referenzfahrt über „Maximale Position“ hinaus
  schritte_pro_grad: "6.89"   # am Knopf: 1600 Schritte/Motorumdrehung × 34/22 ÷ 360°

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - heizung_logik.h
  on_boot:
    priority: -100
    then:
      - script.execute: plan_laden
      - delay: 3s
      - script.execute: wake_display
      - if:
          condition:
            switch.is_on: testmodus
          then:
            - script.execute: test_start
          else:
            - script.execute: homing

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Heizung Fallback"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  local: true
  js_include: heizung_ui.js
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
  sorting_groups:
    - id: grp_bedienung
      name: "Bedienung"
      sorting_weight: 10
    - id: grp_plan
      name: "Wochenplan"
      sorting_weight: 20
    - id: grp_einst
      name: "Einstellungen"
      sorting_weight: 30
    - id: grp_test
      name: "Motortest"
      sorting_weight: 35
    - id: grp_diag
      name: "Diagnose"
      sorting_weight: 40

status_led:
  pin: GPIO7

time:
  - platform: sntp
    id: uhr
    timezone: Europe/Zurich
    on_time_sync:
      - script.execute: neu_berechnen
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              auto now = id(uhr).now();
              if (!now.is_valid()) return;
              int tag = hz::wtag_mo0(now.day_of_week);
              int minute = now.hour * 60 + now.minute;
              // Ein Wechsel im Plan beendet die manuelle Übersteuerung
              if (hz::wechsel_bei(tag, minute)) id(manuell) = false;
              id(neu_berechnen).execute();
              // Tägliche Referenzfahrt
              if (id(ref_taeglich).state && !id(testmodus).state && id(ui_mode) == 0 && !id(homing_laeuft) &&
                  now.hour == id(ref_zeit).hour && now.minute == id(ref_zeit).minute) {
                id(homing).execute();
              }

# ---------------------------------------------------------------------
# Zustände
# ---------------------------------------------------------------------
globals:
  - id: basis                 # Stufe aus Plan / Hand / Urlaub (ohne Boost)
    type: int
    restore_value: true
    initial_value: "0"
  - id: stufe                 # tatsächlich angefahrene Stufe
    type: int
    restore_value: true
    initial_value: "0"
  - id: manuell               # von Hand übersteuert bis zum nächsten Wechsel
    type: bool
    restore_value: true
    initial_value: "false"
  - id: boost_ende            # Unix-Zeit, 0 = kein Boost
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: urlaub_ende           # Unix-Zeit, 0 = kein Urlaub
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: homed
    type: bool
    initial_value: "false"
  - id: homing_laeuft
    type: bool
    initial_value: "false"
  - id: homing_fehler
    type: bool
    initial_value: "false"
  - id: tmc_status            # Motortreiber per UART: -1 = noch nicht geprüft, 0 = keine Antwort, 1 = ok
    type: int
    initial_value: "-1"
  - id: ui_mode               # 0 = normal, 1 = Menü, 2 = Urlaub einstellen
    type: int
    initial_value: "0"
  - id: menu_idx
    type: int
    initial_value: "0"
  - id: edit_tage
    type: int
    initial_value: "7"
  - id: letzte_eingabe
    type: uint32_t
    initial_value: "0"
  - id: disp                  # 2 = hell, 1 = gedimmt, 0 = aus
    type: int
    initial_value: "2"
  - id: hinweis_aktiv
    type: bool
    initial_value: "false"
  - id: hinweis1
    type: std::string
    initial_value: '""'
  - id: hinweis2
    type: std::string
    initial_value: '""'

# ---------------------------------------------------------------------
# Bus, Sensoren
# ---------------------------------------------------------------------
i2c:
  sda: GPIO4
  scl: GPIO21
  frequency: 100kHz
  scan: true

# Eindraht-UART zum TMC2209 (PDN_UART): TX über R7 (1 k), RX direkt.
# Adresse 0 (MS1 = MS2 = GND). Funktioniert nur mit 12 V, nicht über USB allein.
uart:
  id: tmc_uart
  tx_pin: GPIO10
  rx_pin: GPIO20
  baud_rate: 115200

one_wire:
  - platform: gpio
    pin: GPIO6

sensor:
  - platform: sht4x
    address: 0x44
    update_interval: 30s
    temperature:
      id: raumtemp
      name: "Raumtemperatur"
      filters:
        - lambda: return x + id(cfg_offset).state;
      web_server: {sorting_group_id: grp_bedienung, sorting_weight: 2}
    humidity:
      id: feuchte
      name: "Luftfeuchte"
      web_server: {sorting_group_id: grp_bedienung, sorting_weight: 3}

  - platform: dallas_temp
    id: ofentemp
    name: "Ofentemperatur"
    update_interval: 30s
    web_server: {sorting_group_id: grp_diag, sorting_weight: 1}

  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_diag, sorting_weight: 5}

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_diag, sorting_weight: 7}

  - platform: template
    name: "Motorposition"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(knob).current_position;
    web_server: {sorting_group_id: grp_diag, sorting_weight: 4}

  - platform: template
    id: knopfwinkel
    name: "Knopfwinkel"
    unit_of_measurement: "°"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      const int sg = id(richtung_inv).state ? -1 : 1;
      return sg * id(knob).current_position / ${schritte_pro_grad};
    filters:
      - delta: 0.5
    web_server: {sorting_group_id: grp_test, sorting_weight: 2}

text_sensor:
  # Maschinenlesbarer Gesamtzustand für die Weboberfläche (JSON)
  - platform: template
    id: status_ts
    name: "Status"
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_diag, sorting_weight: 9}

  - platform: wifi_info
    ip_address:
      name: "IP"
      entity_category: diagnostic
      web_server: {sorting_group_id: grp_diag, sorting_weight: 6}

binary_sensor:
  - platform: template
    id: tmc_ok_bs
    name: "Treiber UART"
    entity_category: diagnostic
    lambda: return id(tmc_status) == 1;
    web_server: {sorting_group_id: grp_diag, sorting_weight: 3}

  - platform: template
    id: brenner
    name: "Brenner"
    lambda: |-
      return id(ofentemp).has_state() && id(ofentemp).state > id(cfg_brenner).state;
    web_server: {sorting_group_id: grp_diag, sorting_weight: 2}

  - platform: gpio
    id: btn_up
    internal: true
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  - platform: gpio
    id: btn_dn
    internal: true
    pin:
      number: GPIO8
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

# ---------------------------------------------------------------------
# Schrittmotor (TMC2209 im STEP/DIR-Modus)
# Der sleep_pin schaltet den Treiber (ENN) ab, sobald das Ziel erreicht ist:
# im Stillstand ist der Motor stromlos und der Knopf lässt sich von Hand drehen.
# ---------------------------------------------------------------------
stepper:
  - platform: a4988
    id: knob
    step_pin: GPIO0
    dir_pin: GPIO1
    sleep_pin:
      number: GPIO3            # ENN: LOW = Treiber an
      inverted: true
    max_speed: ${speed} steps/s
    acceleration: 400 steps/s^2
    deceleration: 400 steps/s^2

# ---------------------------------------------------------------------
# Tasten auswerten (alle 50 ms) + Menü-Timeout
#   kurz PLUS / MINUS  -> taste(1) / taste(2)
#   beide gleichzeitig -> taste(3)   (normal: 0,8 s halten, im Menü: sofort)
#   im Urlaub-Bildschirm: Taste halten = schnell zählen
# ---------------------------------------------------------------------
interval:
  - interval: 50ms
    then:
      - lambda: |-
          static bool war_p = false, war_m = false, kombi = false, kombi_fertig = false;
          static bool halten_p = false, halten_m = false;
          static uint32_t t_p = 0, t_m = 0, t_kombi = 0, t_rep = 0;
          const uint32_t ms = millis();
          const bool p = id(btn_up).state, m = id(btn_dn).state;

          if (p && m) {
            if (!kombi) { kombi = true; kombi_fertig = false; t_kombi = ms; }
            const uint32_t noetig = (id(ui_mode) == 0) ? 800 : 150;
            if (!kombi_fertig && ms - t_kombi >= noetig) {
              kombi_fertig = true;
              id(taste).execute(3);
            }
          } else if (kombi) {
            if (!p && !m) kombi = false;          // erst nach vollständigem Loslassen weiter
          } else {
            if (p && !war_p) { t_p = ms; halten_p = false; }
            if (m && !war_m) { t_m = ms; halten_m = false; }
            // Halten = schnell zählen (nur im Urlaub-Bildschirm)
            if (id(ui_mode) == 2) {
              if (p && ms - t_p > 600 && ms - t_rep > 150) { halten_p = true; t_rep = ms; id(taste).execute(1); }
              if (m && ms - t_m > 600 && ms - t_rep > 150) { halten_m = true; t_rep = ms; id(taste).execute(2); }
            }
            // Klick beim Loslassen
            if (!p && war_p && !halten_p && ms - t_p < 1500) id(taste).execute(1);
            if (!m && war_m && !halten_m && ms - t_m < 1500) id(taste).execute(2);
          }
          war_p = p && !kombi;
          war_m = m && !kombi;

          // Menü schliesst nach 20 s ohne Eingabe
          if (id(ui_mode) != 0 && ms - id(letzte_eingabe) > 20000) id(ui_mode) = 0;

  - interval: 30s
    then:
      - script.execute: status_senden

# ---------------------------------------------------------------------
# Skripte
# ---------------------------------------------------------------------
script:
  # Wochenplan aus den 7 Texten einlesen
  - id: plan_laden
    then:
      - lambda: |-
          hz::parse_tag(0, id(plan_mo).state);
          hz::parse_tag(1, id(plan_di).state);
          hz::parse_tag(2, id(plan_mi).state);
          hz::parse_tag(3, id(plan_do).state);
          hz::parse_tag(4, id(plan_fr).state);
          hz::parse_tag(5, id(plan_sa).state);
          hz::parse_tag(6, id(plan_so).state);
          id(neu_berechnen).execute();

  # Zentrale Entscheidung: welche Stufe gilt jetzt?
  # Reihenfolge: Boost > Urlaub > manuell > Wochenplan > unverändert
  - id: neu_berechnen
    then:
      - lambda: |-
          auto now = id(uhr).now();
          const bool zeit_ok = now.is_valid();
          const uint32_t ts = zeit_ok ? (uint32_t) now.timestamp : 0;

          if (id(boost_ende) != 0 && zeit_ok && ts >= id(boost_ende)) id(boost_ende) = 0;
          if (id(urlaub_ende) != 0 && zeit_ok && ts >= id(urlaub_ende)) {
            id(urlaub_ende) = 0;
            id(manuell) = false;
          }

          if (!id(manuell)) {
            if (id(urlaub_ende) != 0) {
              id(basis) = (int) id(cfg_urlaub_stufe).state;
            } else if (id(zeitplan).state && zeit_ok) {
              int l = hz::stufe_um(hz::wtag_mo0(now.day_of_week), now.hour * 60 + now.minute);
              if (l >= 0) id(basis) = l;
            }
          }
          int neu = (id(boost_ende) != 0) ? (int) id(cfg_boost_stufe).state : id(basis);
          if (neu < 0) neu = 0;
          if (neu > 7) neu = 7;
          const bool geaendert = (neu != id(stufe));
          id(stufe) = neu;
          if (geaendert || !id(stufe_num).has_state() || (int) id(stufe_num).state != neu)
            id(stufe_num).publish_state(neu);
          id(motor_fahren).execute();
          id(status_senden).execute();

  # Zielposition: ✱ liegt knapp neben dem Anschlag, von ✱ bis 1 ist der Weg länger
  # (ca. 100°) als zwischen den Ziffern (ca. 32°).
  - id: motor_fahren
    then:
      - lambda: |-
          if (id(testmodus).state) return;          // im Testmodus nur von Hand
          if (!id(homed) || id(homing_laeuft)) return;
          const int sg = id(richtung_inv).state ? -1 : 1;
          int t;
          if (id(stufe) <= 0) t = (int) id(cfg_stern).state;
          else t = (int) id(cfg_eins).state + (id(stufe) - 1) * (int) id(cfg_schritte).state;
          const int mx = (int) id(cfg_max).state;
          if (t > mx) t = mx;
          if (t < 0) t = 0;
          id(knob).set_target(sg * t);

  # Stufe von Hand (Tasten oder Web)
  - id: manuell_setzen
    parameters:
      neue_stufe: int
    then:
      - lambda: |-
          int s = neue_stufe;
          if (s < 0) s = 0;
          if (s > 7) s = 7;
          id(boost_ende) = 0;                       // Handeingriff beendet den Boost
          id(basis) = s;
          // Übersteuerung merken, wenn sonst Plan oder Urlaub die Stufe vorgeben würde
          id(manuell) = (id(urlaub_ende) != 0) || (id(zeitplan).state && hz::hat_plan());
          id(neu_berechnen).execute();

  - id: boost_start
    parameters:
      minuten: int
    then:
      - lambda: |-
          auto now = id(uhr).now();
          if (!now.is_valid()) {
            id(zeige_hinweis).execute("Keine Uhrzeit", "Boost nicht möglich");
            return;
          }
          if (minuten < 5) minuten = 5;
          id(boost_ende) = (uint32_t) now.timestamp + (uint32_t) minuten * 60;
          id(neu_berechnen).execute();

  - id: urlaub_setzen
    parameters:
      tage: int
    then:
      - lambda: |-
          if (tage <= 0) {
            id(urlaub_ende) = 0;
            id(manuell) = false;
            id(neu_berechnen).execute();
            return;
          }
          auto now = id(uhr).now();
          if (!now.is_valid()) {
            id(zeige_hinweis).execute("Keine Uhrzeit", "Urlaub nicht möglich");
            return;
          }
          if (tage > 60) tage = 60;
          id(urlaub_ende) = hz::urlaub_ende(now.timestamp, tage, id(urlaub_zeit).hour, id(urlaub_zeit).minute);
          id(manuell) = false;
          id(neu_berechnen).execute();

  # Zustand als JSON für die Weboberfläche
  - id: status_senden
    then:
      - lambda: |-
          auto now = id(uhr).now();
          const bool zeit_ok = now.is_valid();
          char nt[8] = "";
          const char *nd = "";
          int ns = -1;
          if (zeit_ok && id(zeitplan).state && id(urlaub_ende) == 0) {
            int t, m, s, v;
            if (hz::naechster(hz::wtag_mo0(now.day_of_week), now.hour * 60 + now.minute, t, m, s, v)) {
              snprintf(nt, sizeof(nt), "%02d:%02d", m / 60, m % 60);
              if (v > 0) nd = hz::WT[t];
              ns = s;
            }
          }
          char b[256];
          snprintf(b, sizeof(b),
                   "{\"s\":%d,\"b\":%d,\"zp\":%d,\"ov\":%d,\"be\":%u,\"ue\":%u,\"t\":%u,\"h\":%d,\"hl\":%d,\"hf\":%d,"
                   "\"tu\":%d,\"tm\":%d,\"nd\":\"%s\",\"nt\":\"%s\",\"ns\":%d}",
                   id(stufe), id(basis), id(zeitplan).state ? 1 : 0, id(manuell) ? 1 : 0,
                   (unsigned) id(boost_ende), (unsigned) id(urlaub_ende),
                   (unsigned) (zeit_ok ? now.timestamp : 0), id(homed) ? 1 : 0, id(homing_laeuft) ? 1 : 0,
                   id(homing_fehler) ? 1 : 0, id(tmc_status), id(testmodus).state ? 1 : 0, nd, nt, ns);
          id(status_ts).publish_state(b);

  # Motorstrom über UART einstellen, in % des mit R9 eingestellten Maximums (ca. 0,7 A).
  # Schreibt GCONF jedes Mal mit (falls der Treiber neu gestartet ist) und prüft über
  # den Schreibzähler IFCNT, ob der Treiber die Befehle angenommen hat.
  - id: tmc_strom
    parameters:
      prozent: int
    then:
      - lambda: |-
          auto *u = id(tmc_uart);
          auto lese = [&](uint8_t reg, uint32_t &wert) -> bool {
            uint8_t q[4];
            hz::tmc_leseanfrage(q, reg);
            uint8_t m;
            while (u->available()) u->read_byte(&m);       // Reste verwerfen
            u->write_array(q, 4);
            u->flush();
            // Eindraht-Bus: zuerst kommt das Echo der 4 Anfragebytes, dann 8 Byte Antwort
            uint8_t a[12];
            size_t n = 0;
            const uint32_t t0 = millis();
            while (n < sizeof(a) && millis() - t0 < 30) {
              if (u->available()) u->read_byte(&a[n++]);
              else delay(1);
            }
            return n >= 8 && hz::tmc_antwort(a + n - 8, reg, wert);
          };
          auto schreibe = [&](uint8_t reg, uint32_t wert) {
            uint8_t d[8];
            hz::tmc_schreibdatagramm(d, reg, wert);
            u->write_array(d, 8);
            u->flush();
            delay(2);
          };
          uint32_t vor = 0, nach = 0;
          const bool ok1 = lese(hz::TMC_IFCNT, vor);
          schreibe(hz::TMC_GCONF, hz::TMC_GCONF_WERT);
          schreibe(hz::TMC_IHOLD_IRUN, hz::tmc_ihold_irun(prozent));
          const bool ok2 = lese(hz::TMC_IFCNT, nach);
          const bool ok = ok1 && ok2 && ((nach - vor) & 0xFF) == 2;
          id(tmc_status) = ok ? 1 : 0;
          if (ok) ESP_LOGI("tmc", "Motorstrom %d %%", prozent);
          else ESP_LOGW("tmc", "Treiber antwortet nicht über UART (12 V da?), Strom unverändert");

  # Referenzfahrt ohne Endschalter: mit reduziertem Strom Richtung ✱ fahren, und zwar
  # weiter als der ganze Drehbereich. Am Anschlag ✱ bleibt der Knopf stehen und der Motor
  # rutscht ein paar Schritte durch. Danach gilt: Position 0 = Anschlag ✱.
  - id: homing
    mode: single
    then:
      - if:
          condition:
            switch.is_off: testmodus
          then:
            - script.execute: homing_ablauf
          else:
            - logger.log: "Testmodus: keine Referenzfahrt"

  - id: homing_ablauf
    mode: single
    then:
      - lambda: |-
          id(homed) = false;
          id(homing_fehler) = false;
          id(homing_laeuft) = true;
          id(status_senden).execute();
      - script.execute:
          id: tmc_strom
          prozent: !lambda "return (int) id(cfg_ref_strom).state;"
      - script.wait: tmc_strom
      - lambda: |-
          const int sg = id(richtung_inv).state ? -1 : 1;
          id(knob).set_max_speed(${homing_speed});
          id(knob).report_position(0);
          id(knob).set_target(-sg * ((int) id(cfg_max).state + ${homing_extra}));
      - wait_until:
          condition:
            lambda: return id(knob).has_reached_target();
          timeout: 60s
      - delay: 300ms
      - lambda: |-
          const bool fertig = id(knob).has_reached_target();
          id(knob).report_position(0);
          id(knob).set_target(0);
          id(knob).set_max_speed(${speed});
          id(homed) = fertig;
          id(homing_fehler) = !fertig;
          id(homing_laeuft) = false;
      - script.execute:
          id: tmc_strom
          prozent: 100
      - script.wait: tmc_strom
      - lambda: |-
          if (id(homed)) {
            id(motor_fahren).execute();
          } else {
            ESP_LOGE("motor", "Referenzfahrt fehlgeschlagen");
            id(zeige_hinweis).execute("Referenzfahrt", "fehlgeschlagen");
          }
          if (id(tmc_status) != 1) id(zeige_hinweis).execute("Treiber-UART?", "Strom nicht reduziert");
          id(status_senden).execute();

  # ---------- Testmodus: Motor ohne Aufsatz von Hand fahren ----------
  # Beim Start des Testmodus: Motor anhalten, aktuelle Stellung = Nullpunkt,
  # Test-Strom und Test-Tempo setzen.
  - id: test_start
    then:
      - lambda: |-
          id(homed) = false;
          id(homing_fehler) = false;
          id(knob).set_target(id(knob).current_position);
          id(knob).report_position(0);
          id(knob).set_target(0);
          id(knob).set_max_speed(id(cfg_test_tempo).state);
          id(test_pos).publish_state(0);
      - script.execute:
          id: tmc_strom
          prozent: !lambda "return (int) id(cfg_test_strom).state;"
      - script.wait: tmc_strom
      - lambda: |-
          if (id(tmc_status) != 1) id(zeige_hinweis).execute("Treiber-UART?", "Strom nicht gesetzt");
          else id(zeige_hinweis).execute("Testmodus", "Motor von Hand");
          id(status_senden).execute();

  # Relativ fahren, in Grad am Knopf (Vorzeichen: + = wärmer)
  - id: test_fahren
    parameters:
      grad: int
    then:
      - lambda: |-
          if (!id(testmodus).state) return;
          const int sg = id(richtung_inv).state ? -1 : 1;
          const int schritte = (int) lroundf(grad * ${schritte_pro_grad});
          id(knob).set_target(id(knob).target_position + sg * schritte);
          id(status_senden).execute();

  # Testmodus beenden: normales Tempo, dann Referenzfahrt (setzt den Strom wieder auf 100 %)
  - id: test_ende
    then:
      - lambda: |-
          id(knob).set_target(id(knob).current_position);
          id(knob).set_max_speed(${speed});
      - script.execute: homing

  # Display: 60 s hell, dann gedimmt, nach 5 min aus
  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(oled).turn_on();
          id(oled).set_contrast(id(cfg_hell).state / 100.0f);
          id(disp) = 2;
      - delay: 60s
      - lambda: |-
          id(oled).set_contrast(0.01f);
          id(disp) = 1;
      - delay: 240s
      - lambda: |-
          id(oled).turn_off();
          id(disp) = 0;

  # Hinweis-Rahmen für 2,5 s
  - id: zeige_hinweis
    mode: restart
    parameters:
      zeile1: string
      zeile2: string
    then:
      - lambda: |-
          id(hinweis1) = zeile1;
          id(hinweis2) = zeile2;
          id(hinweis_aktiv) = true;
          id(wake_display).execute();
      - component.update: oled
      - delay: 2500ms
      - lambda: id(hinweis_aktiv) = false;
      - component.update: oled

  # Tastenlogik: k = 1 PLUS, 2 MINUS, 3 beide
  - id: taste
    mode: queued
    parameters:
      k: int
    then:
      - lambda: |-
          id(letzte_eingabe) = millis();
          const bool war_aus = (id(disp) == 0);
          id(wake_display).execute();
          if (war_aus) return;                      // erster Druck weckt nur

          if (id(ui_mode) == 0) {
            if (k == 3) { id(ui_mode) = 1; id(menu_idx) = 0; }
            else if (id(testmodus).state) id(test_fahren).execute(k == 1 ? 10 : -10);   // Testmodus: ±10°
            else id(manuell_setzen).execute(id(stufe) + (k == 1 ? 1 : -1));

          } else if (id(ui_mode) == 1) {            // Menü: 0 Zeitplan, 1 Boost, 2 Urlaub, 3 Referenz, 4 Exit
            if (k == 1) id(menu_idx) = (id(menu_idx) + 4) % 5;
            else if (k == 2) id(menu_idx) = (id(menu_idx) + 1) % 5;
            else {
              switch (id(menu_idx)) {
                case 0:
                  id(ui_mode) = 0;
                  if (id(zeitplan).state) { id(zeitplan).turn_off(); id(zeige_hinweis).execute("Zeitplan AUS", ""); }
                  else { id(zeitplan).turn_on(); id(zeige_hinweis).execute("Zeitplan EIN", ""); }
                  break;
                case 1:
                  id(ui_mode) = 0;
                  if (id(boost_ende) != 0) {
                    id(boost_ende) = 0;
                    id(neu_berechnen).execute();
                    id(zeige_hinweis).execute("Boost beendet", "");
                  } else {
                    id(boost_start).execute(60);
                    if (id(boost_ende) != 0)
                      id(zeige_hinweis).execute("Boost aktiv", "bis " + hz::fmt_zeit(id(boost_ende)));
                  }
                  break;
                case 2: {
                  auto now = id(uhr).now();
                  id(edit_tage) = 7;
                  if (id(urlaub_ende) != 0 && now.is_valid())
                    id(edit_tage) = hz::tage_bis(now.timestamp, id(urlaub_ende));
                  id(ui_mode) = 2;
                  break;
                }
                case 3:
                  id(ui_mode) = 0;
                  id(homing).execute();
                  break;
                default:
                  id(ui_mode) = 0;
              }
            }

          } else {                                  // Urlaub einstellen
            if (k == 1) { if (id(edit_tage) < 30) id(edit_tage)++; }
            else if (k == 2) { if (id(edit_tage) > 0) id(edit_tage)--; }
            else {
              id(ui_mode) = 0;
              id(urlaub_setzen).execute(id(edit_tage));
              if (id(edit_tage) == 0) id(zeige_hinweis).execute("Urlaub beendet", "");
              else if (id(urlaub_ende) != 0)
                id(zeige_hinweis).execute("Urlaub aktiv", "bis " + hz::fmt_datum(id(urlaub_ende), true));
            }
          }
      - component.update: oled

# ---------------------------------------------------------------------
# Bedien-Elemente (Web)
# ---------------------------------------------------------------------
number:
