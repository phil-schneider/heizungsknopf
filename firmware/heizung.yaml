  - file: "gfonts://Roboto@700"
    id: f_fett
    size: 14
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzäöüÄÖÜ?!.:-0123456789"
  - file: "gfonts://Roboto"
    id: f_klein
    size: 12
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzäöüÄÖÜ?!.,:=/+-…>*0123456789"
  - file: "gfonts://Roboto"
    id: f_mini
    size: 10
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzäöüÄÖÜ?!.,:=/+->*0123456789"

# ---------------------------------------------------------------------
# Display 128 x 64
# ---------------------------------------------------------------------
display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"   # SSD1309 ist befehlskompatibel
    address: 0x3C
    contrast: 60%
    update_interval: 500ms
    lambda: |-
      auto now = id(uhr).now();
      const bool zeit_ok = now.is_valid();

      // ---------- Hinweis-Rahmen ----------
      if (id(hinweis_aktiv)) {
        it.rectangle(0, 0, 128, 64);
        it.rectangle(2, 2, 124, 60);
        if (id(hinweis2).empty()) {
          it.print(64, 32, id(f_fett), TextAlign::CENTER, id(hinweis1).c_str());
        } else {
          it.print(64, 24, id(f_fett), TextAlign::CENTER, id(hinweis1).c_str());
          it.print(64, 42, id(f_klein), TextAlign::CENTER, id(hinweis2).c_str());
        }
        return;
      }

      // ---------- Menü ----------
      if (id(ui_mode) == 1) {
        it.print(0, 0, id(f_mini), "MENÜ");
        it.print(127, 0, id(f_mini), TextAlign::TOP_RIGHT, "+/- wählen");
        it.horizontal_line(0, 11, 128);
        static const char *const punkte[5] = {"Zeitplan", "Boost 1 h", "Urlaub", "Referenzfahrt", "Exit"};
        for (int i = 0; i < 5; i++) {
          const int y = 13 + i * 10;
          const bool sel = (i == id(menu_idx));
          if (sel) it.filled_rectangle(0, y, 128, 10);
          const Color c = sel ? COLOR_OFF : COLOR_ON;
          it.print(3, y - 1, id(f_mini), c, punkte[i]);
          std::string r;
          if (i == 0) r = id(zeitplan).state ? "EIN" : "AUS";
          else if (i == 1) r = (id(boost_ende) != 0) ? "aktiv" : "";
          else if (i == 2) r = (id(urlaub_ende) != 0) ? ("bis " + hz::fmt_datum(id(urlaub_ende), false)) : "AUS";
          if (!r.empty()) it.print(125, y - 1, id(f_mini), c, TextAlign::TOP_RIGHT, r.c_str());
        }
        return;
      }

      // ---------- Urlaub einstellen ----------
      if (id(ui_mode) == 2) {
        it.print(0, 0, id(f_mini), "URLAUB");
        it.print(127, 0, id(f_mini), TextAlign::TOP_RIGHT, "beide = OK");
        it.horizontal_line(0, 11, 128);
        it.print(6, 28, id(f_fett), TextAlign::CENTER_LEFT, "-");
        it.print(122, 28, id(f_fett), TextAlign::CENTER_RIGHT, "+");
        it.printf(62, 40, id(f_temp), TextAlign::BASELINE_RIGHT, "%d", id(edit_tage));
        it.print(66, 39, id(f_klein), TextAlign::BASELINE_LEFT, id(edit_tage) == 1 ? "Tag" : "Tage");
        it.horizontal_line(0, 45, 128);
        if (id(edit_tage) == 0) {
          it.print(64, 55, id(f_klein), TextAlign::CENTER, "Urlaub beenden");
        } else if (zeit_ok) {
          const uint32_t e =
              hz::urlaub_ende(now.timestamp, id(edit_tage), id(urlaub_zeit).hour, id(urlaub_zeit).minute);
          it.printf(0, 62, id(f_klein), TextAlign::BASELINE_LEFT, "bis %s", hz::fmt_datum(e, true).c_str());
          it.print(127, 62, id(f_mini), TextAlign::BASELINE_RIGHT, hz::fmt_zeit(e).c_str());
        } else {
          it.print(64, 55, id(f_klein), TextAlign::CENTER, "Keine Uhrzeit");
        }
        return;
      }

      // ---------- Normalanzeige: Kopfzeile ----------
      // WLAN-Symbol (drei Balken), durchgestrichen wenn offline
      const bool wlan = wifi::global_wifi_component->is_connected();
      it.filled_rectangle(0, 6, 2, 3);
      it.filled_rectangle(3, 4, 2, 5);
      it.filled_rectangle(6, 1, 2, 8);
      if (!wlan) it.line(0, 0, 9, 9);
      if (zeit_ok) it.strftime(127, 0, id(f_mini), TextAlign::TOP_RIGHT, "%H:%M", now);
      else it.print(127, 0, id(f_mini), TextAlign::TOP_RIGHT, "--:--");
      it.horizontal_line(0, 11, 128);

      // ---------- Stufe gross + Balken ----------
      const int st = id(stufe);
      if (st <= 0) it.print(0, 54, id(f_gross), TextAlign::BASELINE_LEFT, "*");
      else it.printf(0, 47, id(f_gross), TextAlign::BASELINE_LEFT, "%d", st);
      for (int i = 0; i < 7; i++) {
        const int x = 27 + i * 5, h = 6 + i * 3;
        if (i < st) it.filled_rectangle(x, 47 - h, 3, h);
        else it.rectangle(x, 47 - h, 3, h);
      }

      // ---------- Raumtemperatur ----------
      if (id(raumtemp).has_state() && !std::isnan(id(raumtemp).state)) {
        char b[12];
        snprintf(b, sizeof(b), "%.1f°", id(raumtemp).state);
        for (char *p = b; *p; p++)
          if (*p == '.') *p = ',';
        it.print(127, 45, id(f_temp), TextAlign::BASELINE_RIGHT, b);
      } else {
        it.print(127, 45, id(f_temp), TextAlign::BASELINE_RIGHT, "--°");
      }
      it.horizontal_line(0, 50, 128);

      // ---------- Fusszeile ----------
      const int y = 62;
      if (id(testmodus).state) {
        it.print(0, y, id(f_klein), TextAlign::BASELINE_LEFT, "TESTMODUS");
        it.printf(127, y, id(f_mini), TextAlign::BASELINE_RIGHT, "%d",
                  (int) lroundf((id(richtung_inv).state ? -1 : 1) * id(knob).current_position / ${schritte_pro_grad}));
        return;
      }
      if (id(homing_laeuft)) { it.print(0, y, id(f_klein), TextAlign::BASELINE_LEFT, "Referenzfahrt…"); return; }
      if (id(homing_fehler)) { it.print(0, y, id(f_klein), TextAlign::BASELINE_LEFT, "Referenz?"); return; }

      if (id(boost_ende) != 0) {                    // Flamme
        it.filled_circle(5, 59, 3);
        it.filled_triangle(2, 58, 8, 58, 5, 52);
        it.printf(13, y, id(f_klein), TextAlign::BASELINE_LEFT, "Boost bis %s", hz::fmt_zeit(id(boost_ende)).c_str());
        if (id(basis) <= 0) it.print(127, y, id(f_mini), TextAlign::BASELINE_RIGHT, "> *");
        else it.printf(127, y, id(f_mini), TextAlign::BASELINE_RIGHT, "> %d", id(basis));
        return;
      }
      if (id(urlaub_ende) != 0) {                   // Koffer
        it.rectangle(0, 55, 10, 7);
        it.line(3, 55, 3, 53); it.line(3, 53, 6, 53); it.line(6, 53, 6, 55);
        it.printf(13, y, id(f_klein), TextAlign::BASELINE_LEFT, "Urlaub bis %s",
                  hz::fmt_datum(id(urlaub_ende), false).c_str());
        return;
      }
      // Uhr-Symbol
      it.circle(5, 57, 4);
      it.line(5, 57, 5, 54);
      it.line(5, 57, 7, 57);
      if (!id(zeitplan).state) {
        it.line(0, 62, 10, 52);
        it.print(13, y, id(f_klein), TextAlign::BASELINE_LEFT, "Zeitplan aus");
        return;
      }
      if (!zeit_ok) { it.print(13, y, id(f_klein), TextAlign::BASELINE_LEFT, "Warte auf Uhrzeit"); return; }
      int nt, nm, ns, nv;
      if (!hz::naechster(hz::wtag_mo0(now.day_of_week), now.hour * 60 + now.minute, nt, nm, ns, nv)) {
        it.print(13, y, id(f_klein), TextAlign::BASELINE_LEFT, "kein Wechsel");
        return;
      }
      char z[20];
      if (nv > 0) snprintf(z, sizeof(z), "%s %02d:%02d", hz::WT[nt], nm / 60, nm % 60);
      else snprintf(z, sizeof(z), "%02d:%02d", nm / 60, nm % 60);
      char s2[4];
      if (ns <= 0) snprintf(s2, sizeof(s2), "*");
      else snprintf(s2, sizeof(s2), "%d", ns);
      if (id(manuell)) {
        it.printf(13, y, id(f_klein), TextAlign::BASELINE_LEFT, "%s > %s", z, s2);
        it.print(127, y, id(f_mini), TextAlign::BASELINE_RIGHT, "manuell");
      } else if (nv > 0) {
        it.printf(13, y, id(f_klein), TextAlign::BASELINE_LEFT, "%s > Stufe %s", z, s2);
      } else {
        it.printf(13, y, id(f_klein), TextAlign::BASELINE_LEFT, "%s > Stufe %s", z, s2);
      }
