# Vorlage: Diese Einträge in die secrets.yaml übernehmen und die eigenen Werte eintragen.
# - Mit Python/ESPHome am PC: Datei nach secrets.yaml kopieren (liegt neben heizung.yaml).
# - Mit dem ESPHome Device Builder von Home Assistant: oben rechts „Secrets“ öffnen und die
#   Zeilen unten anhängen. Die Namen beginnen mit heizung_, damit sie nicht mit den
#   Einträgen anderer Geräte (z. B. wifi_ssid) kollidieren.
# secrets.yaml enthält Passwörter und wird nicht ins Repository hochgeladen (siehe .gitignore).
heizung_wifi_ssid: "MeinWLAN"            # Name des WLANs dort, wo die Heizung steht
heizung_wifi_password: "wlan-passwort"   # WLAN-Passwort
heizung_ap_password: "fallback-passwort" # Passwort für das Notfall-WLAN, das der Knopf öffnet, wenn er kein WLAN findet
heizung_ota_password: "ota-passwort"     # Passwort für Updates über WLAN aus ESPHome
heizung_web_username: "admin"            # Anmeldung an der Weboberfläche
heizung_web_password: "web-passwort"
