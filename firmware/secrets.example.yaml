# Vorlage: diese Datei nach secrets.yaml kopieren und die eigenen Werte eintragen.
# secrets.yaml enthält Passwörter und wird nicht ins Repository hochgeladen (siehe .gitignore).
wifi_ssid: "MeinWLAN"            # Name des WLANs zu Hause
wifi_password: "wlan-passwort"   # WLAN-Passwort
ap_password: "fallback-passwort" # Passwort für das Notfall-WLAN, das der Knopf öffnet, wenn er kein WLAN findet
ota_password: "ota-passwort"     # Passwort für Updates über WLAN
web_username: "admin"            # Anmeldung an der Weboberfläche
web_password: "web-passwort"
